[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-mogul"
version = "0.0.0"
description = "The real-estate tycoon that actually teaches you the deal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Real Mogul" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "pre-commit>=3.7",
]
# Server-side receipt verification (Phase 5). Optional so the engine stays lean.
server = [
    "fastapi>=0.110",
    "httpx>=0.27",
]

[tool.setuptools]
# Pure-Python packages tracked explicitly so the import boundaries stay legible.
packages = [
    "engine",
    "engine.economy",
    "engine.finance",
    "engine.assets",
    "engine.world",
    "engine.progression",
    "engine.economy_balance",
    "engine.save",
    "engine.save.migrations",
    "education",
    "monetization",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient warns about httpx versions; not our code.
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["engine"]

[tool.coverage.report]
show_missing = true
# Phase 1 release gate: engine coverage >= 90% (engine/finance currently ~98%).
fail_under = 90

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["engine", "education", "monetization", "ui", "platform"]
